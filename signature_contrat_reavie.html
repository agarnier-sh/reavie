<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réavie – Signature électronique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF1F0;
    --surface: #FFFFFF;
    --ink: #14262B;
    --muted: #55696E;
    --line: #D3E0DE;
    --primary: #0E5A63;
    --primary-hover: #0A474F;
    --on-primary: #FFFFFF;
    --tint: #DDEEEC;
    --ok: #1B7F55;
    --ok-bg: #DDF2E8;
    --err: #B3341F;
    --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C181B; --surface: #132226; --ink: #E6F0EF; --muted: #94AAAE; --line: #263E41;
      --primary: #5CC3CC; --primary-hover: #7DD3DA; --on-primary: #06242A; --tint: #1A3338;
      --ok: #5CD19B; --ok-bg: #153427; --err: #FF8D79;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C181B; --surface: #132226; --ink: #E6F0EF; --muted: #94AAAE; --line: #263E41;
    --primary: #5CC3CC; --primary-hover: #7DD3DA; --on-primary: #06242A; --tint: #1A3338;
    --ok: #5CD19B; --ok-bg: #153427; --err: #FF8D79;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
    display: grid; place-items: center; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  .card {
    width: 100%; max-width: 440px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px;
    box-shadow: 0 24px 48px -32px rgba(10, 40, 46, .55);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand svg { width: 36px; height: 36px; flex: none; }
  .brand span { font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em; }

  h1 { margin: 0 0 6px; font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.02em; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: .9375rem; }

  dl {
    margin: 0 0 24px; padding: 14px 16px; background: var(--tint); border-radius: 8px;
    display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .9375rem;
  }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; text-align: right; }

  label { display: block; font-weight: 600; font-size: .9375rem; margin-bottom: 10px; }
  .code {
    display: block; width: 140px; height: 84px; margin: 0 auto; text-align: center;
    font-size: 2.6rem; font-weight: 700; letter-spacing: .15em; padding-left: .15em;
    font-variant-numeric: tabular-nums;
    border: 2px solid var(--line); border-radius: 10px; background: var(--surface);
    caret-color: var(--primary); transition: border-color .2s, box-shadow .2s;
  }
  .code:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 20%, transparent); }
  .code.invalid { border-color: var(--err); animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  .error { min-height: 1.4em; margin: 8px 0 0; text-align: center; color: var(--err); font-size: .875rem; font-weight: 600; }

  .btn {
    width: 100%; margin-top: 12px; padding: 14px 18px; border: 0; border-radius: 8px;
    background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 1rem; cursor: pointer;
    display: inline-flex; justify-content: center; align-items: center; gap: 10px;
    transition: background .2s, opacity .2s;
  }
  .btn:hover:not(:disabled) { background: var(--primary-hover); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    border: 3px solid color-mix(in srgb, currentColor 28%, transparent);
    border-top-color: currentColor; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .done[hidden], .form[hidden] { display: none; }
  .done { text-align: center; }
  .done-icon {
    width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 50%;
    background: var(--ok-bg); color: var(--ok); display: grid; place-items: center;
  }
  .done-icon svg { width: 36px; height: 36px; }
  .done-icon path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .6s .1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .done h1 { color: var(--ok); }
  .link-btn {
    margin-top: 22px; background: none; border: 0; padding: 4px; color: var(--primary);
    font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .note { margin: 22px 0 0; text-align: center; color: var(--muted); font-size: .8125rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#0E5A63"/>
        <path d="M6 22h8l3-8 5 15 4-11 2 4h6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="9" r="3" fill="#F2B84B"/>
      </svg>
      <span>Réavie</span>
    </div>

    <!-- Formulaire -->
    <div class="form" id="form">
      <h1>Signez votre contrat</h1>
      <p class="sub">Saisissez le code à 2 chiffres pour valider votre signature électronique.</p>

      <dl>
        <dt>Organisme</dt><dd>Mutuelle Réavie</dd>
        <dt>Formule choisie</dt><dd>Confort</dd>
      </dl>

      <label for="code">Code de signature</label>
      <input class="code" id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="one-time-code" placeholder="••" aria-describedby="err">
      <p class="error" id="err" role="alert"></p>

      <button class="btn" id="sign" disabled>Signer</button>
    </div>

    <!-- Confirmation -->
    <div class="done" id="done" hidden role="status">
      <div class="done-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1>Contrat signé</h1>
      <p class="sub" style="margin-bottom:0">Votre contrat Confort avec la Mutuelle Réavie a bien été signé électroniquement.</p>
      <button class="link-btn" id="restart">Recommencer la démo</button>
    </div>

    <p class="note">Démonstration : la signature est simulée.</p>
  </main>

<script>
(function () {
  var code = document.getElementById('code');
  var sign = document.getElementById('sign');
  var err = document.getElementById('err');
  var form = document.getElementById('form');
  var done = document.getElementById('done');

  function refresh() {
    code.value = code.value.replace(/\D/g, '').slice(0, 2);
    sign.disabled = code.value.length !== 2;
    if (code.value.length) { err.textContent = ''; code.classList.remove('invalid'); }
  }
  code.addEventListener('input', refresh);
  code.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); sign.click(); }
  });

  sign.addEventListener('click', function () {
    if (code.value.length !== 2) {
      err.textContent = 'Saisissez un code à 2 chiffres.';
      code.classList.remove('invalid'); void code.offsetWidth; code.classList.add('invalid');
      code.focus();
      return;
    }
    sign.disabled = true; code.disabled = true;
    sign.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>Signature en cours…</span>';
    setTimeout(function () {
      form.hidden = true;
      done.hidden = false;
      document.getElementById('restart').focus();
    }, 1200);
  });

  document.getElementById('restart').addEventListener('click', function () {
    code.value = ''; code.disabled = false;
    sign.textContent = 'Signer'; sign.disabled = true;
    done.hidden = true; form.hidden = false;
    code.focus();
  });
})();
</script>
</body>
</html>
